stages:
  - test
  - build

before_script:
  - chmod +x android/gradlew || true
  - mkdir -p android/app
  - cp "$GOOGLE_SERVICES_JSON" android/app/google-services.json

include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

dependency_scanning:
  stage: test
  variables:
    GRADLE_CLI_OPTS: "--no-daemon"

generate_sbom:
  stage: build
  image: eclipse-temurin:17-jdk
  script:
    - cd android
    - ./gradlew cyclonedxBom --no-daemon
  artifacts:
    name: "sbom-cyclonedx-$CI_COMMIT_REF_NAME"
    reports:
      cyclonedx: android/build/reports/cyclonedx/bom.json
    paths:
      - android/build/reports/cyclonedx/bom.json
    expire_in: 30 days
