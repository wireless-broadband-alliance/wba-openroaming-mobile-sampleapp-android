stages:
  - build
  - test

variables:
  GRADLE_CLI_OPTS: "--no-daemon"
  DS_SBD_ENABLED: "true"
  DS_SBD_SBOM_PATH: "android/build/reports/gl-sbom-android.json"
  DS_MAX_DEPTH: "0"

include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

generate_sbom:
  stage: build
  image: eclipse-temurin:17-jdk
  script:
    - cd android
    - ./gradlew cyclonedxBom --no-daemon
  artifacts:
    name: "sbom-cyclonedx-$CI_COMMIT_REF_NAME"
    reports:
      cyclonedx: android/build/reports/gl-sbom-android.json
    paths:
      - android/build/reports/gl-sbom-android.json
    expire_in: 30 days