stages:
  - build
  - test
  - analyze

build_or_sdk:
  stage: build
  image: gradle:8.8-jdk21
  script:
    - cd android
    - ./gradlew :or-sdk:publishToMavenLocal
  artifacts:
    paths:
      - ~/.m2/repository
  rules:
    - when: always

include:
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

dependency_scanning:
  needs: ["build_or_sdk"]
  variables:
    DS_DIRECTORY: "android"

