stages:
  - build
  - test

variables:
  GRADLE_CLI_OPTS: "--no-daemon"
  DS_EXCLUDED_PATHS: "**/build/**, **/app/build/**"

include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

default:
  before_script:
    - chmod +x android/gradlew || true
    - mkdir -p android/app
    - cp "$GOOGLE_SERVICES_JSON" android/app/google-services.json || true

generate_sbom:
  stage: build
  image:
    name: anchore/syft:v1.18.0
    entrypoint: [""]
  before_script: []
  script:
    - syft dir:./android -o cyclonedx-json@1.5=gl-sbom-android.json
  artifacts:
    name: "sbom-cyclonedx-$CI_COMMIT_REF_NAME"
    reports:
      cyclonedx: gl-sbom-android.json
    paths:
      - gl-sbom-android.json
    expire_in: 30 days
