include:
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

dependency_scanning:
  before_script:
    # Build your internal module to populate Gradle's cache
    - ./gradlew :or-sdk:assembleRelease
    # Then run a normal dependency report
    - ./gradlew :app:dependencies
  variables:
    DS_JAVA_VERSION: "21"
    
