stages:
  - build
  - security

# --- Build internal SDK first ---
build_or_sdk:
  stage: build
  image: registry.gitlab.com/android-ci/android-sdk:34
  script:
    - cd android
    - chmod +x gradlew
    - ./gradlew :or-sdk:assembleRelease
  artifacts:
    paths:
      - android/or-sdk/build
    expire_in: 1h

# --- Security scanning (includes both GitLab templates) ---
include:
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

dependency_scanning:
  stage: security
  needs: ["build_or_sdk"]
  variables:
    DS_JAVA_VERSION: "21"

secret_detection:
  stage: security
