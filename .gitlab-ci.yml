include:
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

dependency_scanning:
  before_script:
    # Move into the Android project directory where gradlew lives
    - cd android
    - chmod +x gradlew
    - ./gradlew :or-sdk:assembleRelease
  variables:
    DS_JAVA_VERSION: "21"
    
