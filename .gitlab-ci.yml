dependency_scanning:
  stage: test
  variables:
    DS_EXCLUDED_ANALYZERS: "gemnasium-maven"
  script:
    - cd android
    - ./gradlew cyclonedxBom
  artifacts:
    reports:
      dependency_scanning:
        - android/app/build/reports/bom.json
        - android/or-sdk/build/reports/bom.json
    paths:
      - android/app/build/reports/bom.json
      - android/or-sdk/build/reports/bom.json
      
include :
  - template : Security/Dependency-Scanning.gitlab-ci.yml
  - template : Security/Secret-Detection.gitlab-ci.yml
