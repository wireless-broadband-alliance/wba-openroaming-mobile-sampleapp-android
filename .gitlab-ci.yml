stages:
  - test
  - build

variables:
  DS_MAX_DEPTH: 5
  GRADLE_CLI_OPTS: "--no-daemon"

include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

default:
  before_script:
    - chmod +x android/gradlew || true
    - mkdir -p android/app
    - cp "$GOOGLE_SERVICES_JSON" android/app/google-services.json || true
